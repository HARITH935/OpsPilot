spring:
  application:
    name: api-gateway
  threads:
    virtual:
      enabled: true   # each request runs on a Java 21 virtual thread: waiting for a slow service costs almost nothing
  mvc:
    problemdetails:
      enabled: true   # Spring's own errors (e.g. 404 for an unknown path) as RFC 9457 Problem Details, like the services
  web:
    resources:
      add-mappings: false   # the gateway serves no static files: an unknown path is a plain 404, whatever the method
  http:
    clients:
      # The HTTP client the gateway uses to call the services. The same limits for every route for now;
      # per-route timeouts come with the circuit breakers (step 2.11).
      connect-timeout: ${GATEWAY_CONNECT_TIMEOUT:1s}   # the service doesn't accept the connection in time → 503
      read-timeout: ${GATEWAY_READ_TIMEOUT:2s}         # the service accepted, but its answer takes too long → 504
  data:
    redis:
      # Redis from deploy/docker (or Kubernetes later): only the rate limiter's counters
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 100ms           # a Redis command slower than this counts as a failure → fail-open, not a slow shop
      connect-timeout: 100ms
  cloud:
    gateway:
      server:
        webmvc:
          # A route = "requests matching these predicates are sent to this uri". The path is passed on unchanged:
          # GET /api/orders/42 on the gateway becomes GET /api/orders/42 on order-service.
          routes:
            - id: orders
              uri: ${ORDER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/orders/**     # ** = any number of path segments, none included: /api/orders matches too
            - id: products
              uri: ${INVENTORY_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/products/**
            - id: payments
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/payments/**

server:
  port: ${SERVER_PORT:8080}   # env var SERVER_PORT, default 8080

gateway:
  jwt:
    issuer: ${JWT_ISSUER:opspilot-gateway}   # the "iss" claim; tokens from anyone else are refused
    ttl: ${JWT_TTL:30m}                       # a token is valid for 30 minutes (architecture doc B2.4)
    # PEM files of the RSA key pair that signs the tokens (in the cloud: a Kubernetes Secret mounted as files).
    # Both empty = a temporary key made at startup: fine locally, but tokens stop working when the gateway restarts.
    private-key-file: ${JWT_PRIVATE_KEY_FILE:}
    public-key-file: ${JWT_PUBLIC_KEY_FILE:}
  demo-users:
    enabled: ${DEMO_USERS_ENABLED:false}   # viewer / engineer / admin via POST /auth/token: local + evals only
    password: ${DEMO_USERS_PASSWORD:}      # required (12+ characters) when enabled; no default on purpose
  # Sliding-window rate limits (architecture doc B2.4). Each route has its own budget per caller.
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    user:                                    # a caller with a valid token, counted by its "sub"
      requests: ${RATE_LIMIT_USER_REQUESTS:20}
      window: 1s
    anonymous:                               # no token: counted by IP address
      requests: ${RATE_LIMIT_ANONYMOUS_REQUESTS:10}
      window: 1s
    login:                                   # POST /auth/token, by IP address: 10 password tries a minute, not 600
      requests: ${RATE_LIMIT_LOGIN_REQUESTS:10}
      window: 1m
    # Proxies whose X-Forwarded-For header is believed: addresses or CIDR ranges, comma-separated. None by default:
    # locally nothing sits in front of the gateway. In Kubernetes, the Ingress (Phase 4).
    trusted-proxies: ${GATEWAY_TRUSTED_PROXIES:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus   # only these actuator endpoints are reachable over HTTP
  endpoint:
    health:
      probes:
        enabled: true   # adds /actuator/health/liveness and /readiness (used by Kubernetes probes)
  health:
    redis:
      enabled: false   # Redis down doesn't make the gateway unhealthy: the limiter fails open (and counts the errors)
