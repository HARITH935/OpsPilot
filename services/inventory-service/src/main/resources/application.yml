spring:
  application:
    name: inventory-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inventory}
    username: ${DB_USERNAME:inventory_user}
    password: ${DB_PASSWORD}   # no default on purpose: the app must be given the password
  jpa:
    open-in-view: false        # don't keep DB connections open while writing the HTTP response
    hibernate:
      ddl-auto: validate       # Flyway owns the schema; Hibernate only checks entities match it
    properties:
      hibernate:
        # Send UPDATEs sorted by primary key: every transaction locks products in the same (SKU) order,
        # so two orders holding the same products can never wait on each other forever (a deadlock)
        order_updates: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}   # Kafka from deploy/docker: reads orders.events + payments.events, sends via the outbox
  data:
    redis:
      # Redis from deploy/docker (shared with the gateway, which uses other keys): only the product cache
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 100ms           # a Redis command slower than this counts as a failure → Postgres answers, not a slow shop
      connect-timeout: 100ms

inventory:
  product-cache:
    enabled: ${PRODUCT_CACHE_ENABLED:true}   # false: never use Redis, read every product from Postgres
    ttl: ${PRODUCT_CACHE_TTL:60s}            # how long a copy is kept (1 s … 1 h); also the most it can be out of date

server:
  port: ${SERVER_PORT:8083}   # env var SERVER_PORT, default 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus   # only these actuator endpoints are reachable over HTTP
  endpoint:
    health:
      probes:
        enabled: true   # adds /actuator/health/liveness and /readiness (used by Kubernetes probes)
  health:
    redis:
      enabled: false   # Redis down doesn't make inventory unhealthy: the cache fails open (and counts the errors)
