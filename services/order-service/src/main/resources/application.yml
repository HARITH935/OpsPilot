spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orders}
    username: ${DB_USERNAME:orders_user}
    password: ${DB_PASSWORD}   # no default on purpose: the app must be given the password
  jpa:
    open-in-view: false        # don't keep DB connections open while writing the HTTP response
    hibernate:
      ddl-auto: validate       # Flyway owns the schema; Hibernate only checks entities match it
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}   # Kafka from deploy/docker: reads inventory.events + payments.events, sends via the outbox

server:
  port: ${SERVER_PORT:8081}   # env var SERVER_PORT, default 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus   # only these actuator endpoints are reachable over HTTP
  endpoint:
    health:
      probes:
        enabled: true   # adds /actuator/health/liveness and /readiness (used by Kubernetes probes)

# The saga timeout (SagaTimeoutJob): every order ends CONFIRMED or CANCELLED within about this long
order:
  saga:
    timeout: ${SAGA_TIMEOUT:30s}                          # a PENDING order older than this is cancelled (reason TIMEOUT)
    check-interval: ${SAGA_TIMEOUT_CHECK_INTERVAL:5s}     # how often the job looks; an order may wait this much longer
