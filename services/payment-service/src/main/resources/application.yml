spring:
  application:
    name: payment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payments}
    username: ${DB_USERNAME:payments_user}
    password: ${DB_PASSWORD}   # no default on purpose: the app must be given the password
  jpa:
    open-in-view: false        # don't keep DB connections open while writing the HTTP response
    hibernate:
      ddl-auto: validate       # Flyway owns the schema; Hibernate only checks entities match it
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}   # Kafka from deploy/docker: reads inventory.events, sends via the outbox

server:
  port: ${SERVER_PORT:8082}   # env var SERVER_PORT, default 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus   # only these actuator endpoints are reachable over HTTP
  endpoint:
    health:
      probes:
        enabled: true   # adds /actuator/health/liveness and /readiness (used by Kubernetes probes)

# The simulated payment provider (SimulatedPaymentProvider). Chaos scenarios change it through the env vars.
payment:
  provider:
    failure-rate: ${PAYMENT_FAILURE_RATE:0.0}   # share of charges that fail: 0.0 = none … 1.0 = all (C12 uses 0.5)
    latency: ${PAYMENT_LATENCY_MS:100}ms        # how long every charge takes
    # Around every call to the provider (ResilientPaymentProvider, architecture doc B2.4)
    resilience:
      timeout: ${PAYMENT_PROVIDER_TIMEOUT:2s}   # no answer in time → PROVIDER_TIMEOUT (not retried)
      retry:                                    # after PROVIDER_ERROR only ("refused, nothing was taken")
        max-retries: 2
        first-wait: 200ms                       # then 400 ms ...
        multiplier: 2
        jitter: 0.5                             # ... each one ± 50% at random
      circuit-breaker:                          # opens when 50% of the last 20 payments failed (after their retries)
        failure-rate-threshold: 50
        sliding-window-size: 20
        minimum-number-of-calls: 20
        wait-in-open-state: ${PAYMENT_PROVIDER_OPEN_FOR:30s}   # no calls this long (PROVIDER_UNAVAILABLE), then test
        permitted-calls-in-half-open-state: 3
      bulkhead:                                 # at most 5 provider calls at once; a 6th waits up to 1 s, then
        max-concurrent-calls: 5                 # PROVIDER_UNAVAILABLE
        max-wait: 1s
