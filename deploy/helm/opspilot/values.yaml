# The shop's settings on the local kind cluster. The same names and values as in Docker Compose, except the addresses:
# Kubernetes Services instead of Compose container names. Passwords only as references to Secrets (created by
# deploy/k3s/secrets-from-env.sh locally, Sealed Secrets in the cloud).

global:
  image:
    registry: ghcr.io/harith935
    # The images CI published from main (images.yml): the same tag for all four. Phase 5's CI bumps it.
    tag: sha-218a8ef

order-service:
  image:
    name: opspilot-order-service
  port: 8081
  env:
    DB_URL: jdbc:postgresql://postgres-rw.opspilot-data.svc:5432/orders   # CloudNativePG's Service of the primary
    KAFKA_BOOTSTRAP_SERVERS: kafka-kafka-bootstrap.opspilot-data.svc:9092  # Strimzi's Service of the broker
  secretEnv:
    DB_USERNAME: {secret: orders-db, key: username}
    DB_PASSWORD: {secret: orders-db, key: password}

inventory-service:
  image:
    name: opspilot-inventory-service
  port: 8083
  env:
    DB_URL: jdbc:postgresql://postgres-rw.opspilot-data.svc:5432/inventory
    KAFKA_BOOTSTRAP_SERVERS: kafka-kafka-bootstrap.opspilot-data.svc:9092
    REDIS_HOST: redis   # its product cache: the redis release in this namespace (deploy/helm/redis)
  secretEnv:
    DB_USERNAME: {secret: inventory-db, key: username}
    DB_PASSWORD: {secret: inventory-db, key: password}
    REDIS_PASSWORD: {secret: redis, key: password}

payment-service:
  image:
    name: opspilot-payment-service
  port: 8082
  env:
    DB_URL: jdbc:postgresql://postgres-rw.opspilot-data.svc:5432/payments
    KAFKA_BOOTSTRAP_SERVERS: kafka-kafka-bootstrap.opspilot-data.svc:9092
    PAYMENT_FAILURE_RATE: "0.0"   # the simulated provider: share of payments that fail (chaos C12 raises it)
    PAYMENT_LATENCY_MS: "100"     # and how long each takes
  secretEnv:
    DB_USERNAME: {secret: payments-db, key: username}
    DB_PASSWORD: {secret: payments-db, key: password}

api-gateway:
  image:
    name: opspilot-api-gateway
  port: 8080
  env:
    ORDER_SERVICE_URL: http://order-service:8081        # the Services of the other three, in this namespace
    INVENTORY_SERVICE_URL: http://inventory-service:8083
    PAYMENT_SERVICE_URL: http://payment-service:8082
    REDIS_HOST: redis                                   # rate-limit counters
    DEMO_USERS_ENABLED: "true"                          # viewer / engineer / admin: local cluster and evals only
    # Requests come in through Traefik (the front door below), which adds the client's address to X-Forwarded-For.
    # The gateway believes that header only when it comes from these addresses: the pod network of kind (k3s:
    # 10.42.0.0/16, Phase 5). The rate limiter then counts per real client, and nobody outside can fake an address.
    GATEWAY_TRUSTED_PROXIES: 10.244.0.0/16
    # ...and only our code reads that header (ClientIpResolver). On Kubernetes, Spring Boot otherwise switches on
    # Tomcat's own handling (server.forward-headers-strategy defaults to "native" there), which trusts EVERY private
    # address as a proxy and rewrites the client address before our code sees it, so the list above was ignored and
    # any pod could fake its address. Found by a test mutation (step 4.6a): without the list, nothing changed.
    SERVER_FORWARDHEADERSSTRATEGY: none
    # The token signing key pair, from the Secret gateway-jwt (mounted below): every gateway pod signs with the same
    # key, so a token from one is accepted by the others (with more than one pod, step 4.7)
    JWT_PRIVATE_KEY_FILE: /etc/opspilot/jwt/private.pem
    JWT_PUBLIC_KEY_FILE: /etc/opspilot/jwt/public.pem
  secretEnv:
    REDIS_PASSWORD: {secret: redis, key: password}
    DEMO_USERS_PASSWORD: {secret: gateway-demo-users, key: password}
  secretFiles:
    - secret: gateway-jwt
      mountPath: /etc/opspilot/jwt
  resources:
    requests:
      memory: 256Mi
    limits:
      memory: 384Mi   # the lightest of the four (no database), as in Compose

# The front door (Gateway API, served by Traefik in kube-system; templates/front-door.yaml, step 4.6a)
frontDoor:
  gatewayClassName: traefik   # created by Traefik's chart (deploy/k3s/traefik-values.yaml)
  port: 8000                  # Traefik's entrypoint "web"; the node's port 80 leads there
  hostname: ""                # "" = any host name; the public domain in Phase 5
  paths:                      # what the outside may reach, all through api-gateway
    - /api
    - /auth
    - /.well-known

# Network rules (templates/network-policies.yaml, step 4.6b, ADR 0014): who may connect to each service, and to
# what each service may connect. Together with deploy/k8s/network-policies.yaml (everything else closed).
networkPolicy:
  enabled: true
  frontDoor:                  # Traefik, the only way in from outside
    namespace: kube-system
    podLabels: {app.kubernetes.io/name: traefik}
  redis:                      # the redis release in this namespace (deploy/helm/redis)
    podLabels: {app.kubernetes.io/name: redis, app.kubernetes.io/instance: redis}
    port: 6379
  postgres:                   # CloudNativePG's PostgreSQL pods
    namespace: opspilot-data
    podLabels: {cnpg.io/cluster: postgres}
    port: 5432
  kafka:                      # Strimzi's broker pods
    namespace: opspilot-data
    podLabels: {strimzi.io/cluster: kafka, strimzi.io/name: kafka-kafka}
    port: 9092
