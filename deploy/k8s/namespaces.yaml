# OpsPilot's namespaces (CLAUDE.md §8), with Kubernetes' Pod Security Admission rules. A pod that breaks the
# namespace's level is refused when it is created. More namespaces (opspilot-obs, opspilot-agent, ...) come with the
# phases that need them. Apply: kubectl apply -f deploy/k8s/namespaces.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: opspilot-apps   # the four services (and the data-plane Redis, step 4.2)
  labels:
    # "restricted", the strictest level: no root, no privilege escalation, no Linux capabilities, seccomp on.
    # Our images run as user 10001 and need none of these (step 3.1).
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36   # pinned: a Kubernetes upgrade can't tighten the rules by surprise
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: opspilot-data   # Postgres + its operator (CloudNativePG, 4.2a), Kafka (Strimzi, 4.3)
  labels:
    # "restricted" too (since 4.2a): the CloudNativePG operator and PostgreSQL pods pass it (checked with a server-side
    # dry run). Strimzi's pods (4.3) will have to pass it as well.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
