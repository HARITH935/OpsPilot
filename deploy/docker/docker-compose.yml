# Local development stack. Run from the repo root:
#   docker compose -f deploy/docker/docker-compose.yml up -d                           PostgreSQL, Kafka, Redis
#   docker compose -f deploy/docker/docker-compose.yml --profile apps up -d --build    ... + the four services = the shop
# Secrets come from deploy/docker/.env (copy .env.example; never commit .env).
name: opspilot

# ── Shared settings of the four Java services ────────────────────────────────────────────────────────────────────────
# "x-" blocks are ignored by Compose itself; they only hold YAML anchors (&name), pasted below with "<<: *name".
x-java-service: &java-service
  profiles: ["apps"]   # only with --profile apps: a plain `up` stays Postgres + Kafka + Redis
  # Always build from services/Dockerfile, never download: without this, Compose first tries to pull
  # "opspilot/<service>" from Docker Hub, where anyone could publish an image under that name.
  pull_policy: build
  read_only: true      # nothing in the container can be written...
  tmpfs:
    - /tmp             # ...except /tmp, kept in memory (Tomcat and Java write temporary files there)
  cap_drop: [ALL]      # no Linux capabilities (special root powers); a Java service on a port > 1024 needs none
  security_opt:
    - no-new-privileges:true   # no program inside can gain more rights than it started with
  restart: unless-stopped
  deploy:
    resources:
      limits:
        memory: 512M   # the JVM takes up to half as heap (MaxRAMPercentage=50 in the Dockerfile); measured use 240–330 MB

# Ready = the service's readiness endpoint answers UP (curl is in the image)
x-java-healthcheck: &java-healthcheck
  start_period: 90s
  start_interval: 2s   # check often while it starts...
  interval: 15s        # ...then calmly
  timeout: 3s
  retries: 3

services:
  postgres:
    image: postgres:16.15-alpine   # exact version pinned so every machine gets the same database
    container_name: opspilot-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/docker/.env}
      # Read by the init script to create one database + user per service
      ORDERS_DB_PASSWORD: ${ORDERS_DB_PASSWORD:?set ORDERS_DB_PASSWORD in deploy/docker/.env}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?set INVENTORY_DB_PASSWORD in deploy/docker/.env}
      PAYMENTS_DB_PASSWORD: ${PAYMENTS_DB_PASSWORD:?set PAYMENTS_DB_PASSWORD in deploy/docker/.env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"   # host:container
    volumes:
      - pgdata:/var/lib/postgresql/data                               # data survives container restarts
      - ./postgres/init:/docker-entrypoint-initdb.d:ro                # scripts run once, on first start with an empty volume
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M   # keep the 8 GB dev machine responsive
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.2.2   # official image; same version as the Kafka client inside Spring Boot 4.1.2
    container_name: opspilot-kafka
    environment:
      # KRaft mode: this one node is both the broker (stores messages) and the controller (manages the cluster)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093   # the controllers that vote on cluster changes: just this node
      CLUSTER_ID: 52iq3sKeSrGL7zeTA99S5g                 # from kafka-storage.sh random-uuid; an id, not a secret
      # Listeners (name://host:port): apps on this machine, other containers, the controller
      KAFKA_LISTENERS: HOST://:9092,DOCKER://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:19092   # the address each client is told to use
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT   # no TLS, no login
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      # One broker, so Kafka's own internal topics keep one copy
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topics come only from kafka/topics.txt; a misspelled one fails loudly
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0  # dev: a new consumer starts at once (the default waits 3 s for others)
      KAFKA_LOG_DIRS: /var/lib/kafka/data        # where messages are stored ("log" = Kafka's message files)
      KAFKA_HEAP_OPTS: -Xmx512m                  # Java heap cap; Kafka's default is 1 GB
    ports:
      - "127.0.0.1:9092:9092"   # only this machine can connect: there is no password
    volumes:
      - kafkadata:/var/lib/kafka/data   # topics and messages survive restarts
    # The image declares these folders as volumes. They are unused here, so keep them in memory;
    # otherwise every new container leaves unnamed volumes behind.
    tmpfs:
      - /etc/kafka/secrets
      - /mnt/shared/config
    healthcheck:
      # Healthy once the broker answers a real Kafka request (an open port alone is not enough)
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      start_period: 60s
      start_interval: 2s   # check often while Kafka starts...
      interval: 30s        # ...then rarely: every check starts a small Java program
      timeout: 15s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G   # the 512 MB heap + Java's own memory outside the heap
    restart: unless-stopped

  # One-shot job: creates the topics once Kafka is healthy, then exits (shows as "exited (0)" = success)
  kafka-init:
    image: apache/kafka:4.2.2   # same image, used only for its command-line tools
    container_name: opspilot-kafka-init
    depends_on:
      kafka:
        condition: service_healthy   # start only after Kafka's health check passes
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    volumes:
      - ./kafka:/scripts:ro   # topics.txt + create-topics.sh
    tmpfs:   # same reason as in kafka above
      - /var/lib/kafka/data
      - /etc/kafka/secrets
      - /mnt/shared/config

  # Redis: the API gateway's rate-limit counters (step 2.9) and, from step 2.10, inventory's product cache.
  # Nothing in it has to survive a restart, so it keeps everything in memory only (no files written).
  redis:
    image: redis:7.4.12-alpine   # exact version pinned, like the others
    container_name: opspilot-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in deploy/docker/.env}
      REDISCLI_AUTH: ${REDIS_PASSWORD}   # lets redis-cli in this container log in (health check) without -a <password>
    # $$ = a literal $ for Docker Compose, so the shell inside the container fills in the password
    command:
      - sh
      - -c
      - >-
        exec redis-server --requirepass "$$REDIS_PASSWORD"
        --maxmemory 64mb --maxmemory-policy allkeys-lru
        --save "" --appendonly no
    ports:
      - "127.0.0.1:6379:6379"   # only this machine can connect (and a password is required anyway)
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 128M   # Redis is capped at 64 MB of data above; the rest is headroom
    restart: unless-stopped

  # ── The shop: the four services, built from services/Dockerfile (step 3.1, ADR 0008) ──────────────────────────────
  # Inside this network they reach the others by service name (postgres:5432, kafka:19092, redis:6379, order-service:8081).
  # Ports are published on 127.0.0.1 only. A few settings can be changed for one start from the shell, e.g.
  #   PAYMENT_FAILURE_RATE=1.0 docker compose -f deploy/docker/docker-compose.yml --profile apps up -d payment-service
  order-service:
    <<: *java-service
    image: opspilot/order-service:dev
    build:
      context: ../../services   # relative to this file
      args:
        SERVICE: order-service
    container_name: opspilot-order-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/orders
      DB_PASSWORD: ${ORDERS_DB_PASSWORD:?set ORDERS_DB_PASSWORD in deploy/docker/.env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092   # Kafka's listener for other containers
    ports:
      - "127.0.0.1:18081:8081"   # 18081 on this machine: 8081 is often taken by other dev tools (e.g. Expo)
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully   # the topics exist
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8081/actuator/health/readiness"]

  inventory-service:
    <<: *java-service
    image: opspilot/inventory-service:dev
    build:
      context: ../../services
      args:
        SERVICE: inventory-service
    container_name: opspilot-inventory-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/inventory
      DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?set INVENTORY_DB_PASSWORD in deploy/docker/.env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      REDIS_HOST: redis   # its product cache
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in deploy/docker/.env}
    ports:
      - "127.0.0.1:8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8083/actuator/health/readiness"]

  payment-service:
    <<: *java-service
    image: opspilot/payment-service:dev
    build:
      context: ../../services
      args:
        SERVICE: payment-service
    container_name: opspilot-payment-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/payments
      DB_PASSWORD: ${PAYMENTS_DB_PASSWORD:?set PAYMENTS_DB_PASSWORD in deploy/docker/.env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9999   # DELIBERATELY WRONG: checks that the e2e job catches it
      # The simulated payment provider: healthy unless set otherwise for one start (chaos scenario C12 uses 0.5)
      PAYMENT_FAILURE_RATE: ${PAYMENT_FAILURE_RATE:-0.0}
      PAYMENT_LATENCY_MS: ${PAYMENT_LATENCY_MS:-100}
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8082/actuator/health/readiness"]

  api-gateway:
    <<: *java-service
    image: opspilot/api-gateway:dev
    build:
      context: ../../services
      args:
        SERVICE: api-gateway
    container_name: opspilot-api-gateway
    environment:
      ORDER_SERVICE_URL: http://order-service:8081
      INVENTORY_SERVICE_URL: http://inventory-service:8083
      PAYMENT_SERVICE_URL: http://payment-service:8082
      REDIS_HOST: redis   # rate-limit counters
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in deploy/docker/.env}
      # Demo logins viewer / engineer / admin (POST /auth/token): local only, never in the cloud
      DEMO_USERS_ENABLED: "true"
      DEMO_USERS_PASSWORD: ${DEMO_USERS_PASSWORD:?set DEMO_USERS_PASSWORD in deploy/docker/.env}
      GATEWAY_CIRCUIT_OPEN_FOR: ${GATEWAY_CIRCUIT_OPEN_FOR:-30s}   # how long an open circuit refuses calls
      # No JWT key files here: the gateway makes a temporary key pair at every start (logged as a WARN)
    ports:
      - "127.0.0.1:8080:8080"   # the front door
    depends_on:
      redis:
        condition: service_healthy
      order-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M   # the lightest of the four (no database); heap up to 192 MB
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/actuator/health/readiness"]

volumes:
  pgdata:
  kafkadata:
