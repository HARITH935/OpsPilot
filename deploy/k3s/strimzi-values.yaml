# Settings for the Strimzi operator (Helm chart strimzi-kafka-operator 1.3.0), installed by kind-up.sh into
# opspilot-data. The operator runs Kafka for us: our chart deploy/helm/kafka only describes the Kafka cluster and its
# topics, Strimzi creates and looks after the broker. It watches only its own namespace (the chart's default).

# The operator image 1.3.0, pinned by digest. The Topic Operator (which turns KafkaTopic objects into real topics) runs
# from the same image.
image:
  digest: sha256:4deb564fa329afa4046c550a6f8f1a6d00be3b9297e556969acabe6647b6676f
topicOperator:
  image:
    digest: sha256:4deb564fa329afa4046c550a6f8f1a6d00be3b9297e556969acabe6647b6676f

extraEnvs:
  # Every pod Strimzi creates (Kafka, the Topic Operator) gets the security settings the "restricted" Pod Security
  # level asks for. Without this, Strimzi's default ("baseline") would be refused in opspilot-data.
  - name: STRIMZI_POD_SECURITY_PROVIDER_CLASS
    value: restricted
