# Settings for the CloudNativePG operator (Helm chart cloudnative-pg 0.29.1 = operator 1.30.1), installed by kind-up.sh
# into opspilot-data. The operator is a program that runs in the cluster and looks after PostgreSQL: our chart
# deploy/helm/postgres only describes the database we want (a "Cluster" resource), the operator creates and runs it.
image:
  # The image the chart's version would pick anyway, pinned by its digest: the same bytes on every install
  tag: "1.30.1@sha256:923c267ec29636db3bee20f993d0ec4973fa22998e1adad37da79e4d32b5bc07"

config:
  # Watch only its own namespace (opspilot-data). Its wide rights (Secrets, Pods, ...) then become a Role in this
  # namespace instead of a ClusterRole: the operator cannot read or change anything in opspilot-apps or elsewhere.
  clusterWide: false

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    memory: 256Mi
