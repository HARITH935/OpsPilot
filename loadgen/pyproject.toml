[project]
name = "opspilot-loadgen"
version = "0.1.0"
description = "Locust traffic for the OpsPilot demo shop, sent through the API gateway"
requires-python = ">=3.11"
dependencies = ["locust>=2.47,<3"]

[dependency-groups]
dev = ["pytest>=9.2,<10", "ruff>=0.17,<0.18"]

[tool.uv]
package = false   # a Locust script and its helpers, not a library to install

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]   # pycodestyle, pyflakes, import order, modern syntax, likely bugs

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]   # so the tests can import checks.py from this folder
